name: articles

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/update-articles.mjs
      - name: Commit if the list changed
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "Dima"
          git config user.email "medvedka.dima@yandex.ru"
          git commit -am "Обновление README"
          git push
